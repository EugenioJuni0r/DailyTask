<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Tasks</title>
<link rel="stylesheet" href="/style.css">
<style>
  header h1 { text-align:center; }
  .week, #grid { display:grid; grid-template-columns:repeat(7,1fr); }
  .week div { text-align:center; padding:.5rem 0; font-size:.85rem; }
  .week div:first-child { color:var(--sun); }
  .cell { min-height:104px; min-width:0; display:flex; flex-direction:column; gap:2px; padding:.4rem 1px;
          border:0; border-top:1px solid var(--line); background:none; color:inherit; font:inherit; cursor:pointer; }
  .cell:disabled { cursor:default; }
  .num { font-size:.95rem; margin-bottom:2px; }
  .sun .num { color:var(--sun); }
  .out .num { color:var(--dim); }
  .sun.out .num { color:var(--sun-dim); }
  .out .chip { opacity:.55; }
  .chip { display:block; padding:1px 3px; border-radius:3px; font-size:.68rem; line-height:1.25; text-align:left;
          overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .more { font-size:.65rem; color:var(--dim); }
</style>
</head>
<body>

<header>
  <button class="icon" id="prev" aria-label="Mês anterior">&lt;</button>
  <h1 id="title"></h1>
  <button class="icon" id="next" aria-label="Próximo mês">&gt;</button>
</header>

<div class="week"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
<div id="grid"></div>

<script>
  const YEAR = 2027;
  const MONTHS = ["JAN.","FEV.","MAR.","ABR.","MAIO","JUN.","JUL.","AGO.","SET.","OUT.","NOV.","DEZ."];

  const grid = document.getElementById("grid");
  const title = document.getElementById("title");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  let diaryId = null;
  let month = Math.min(11, Math.max(0, parseInt(new URLSearchParams(location.search).get("m")) || 0));

  const pad = n => String(n).padStart(2, "0");
  const dayIndex = (y, m, d) => Math.round((Date.UTC(y, m, d) - Date.UTC(YEAR, 0, 1)) / 864e5);

  async function load() {
    title.textContent = MONTHS[month] + " " + YEAR;
    prev.disabled = month === 0;
    next.disabled = month === 11;

    const offset = new Date(YEAR, month, 1).getDay();
    const daysInMonth = new Date(YEAR, month + 1, 0).getDate();
    const rows = Math.ceil((offset + daysInMonth) / 7);
    const first = dayIndex(YEAR, month, 1 - offset);
    const last = first + rows * 7 - 1;

    const byDay = new Map();
    try {
      const r = await fetch("/diaries/" + diaryId + "/events?from=" + Math.max(0, first) + "&to=" + Math.min(364, last));
      if (r.ok) {
        for (const ev of await r.json()) {
          if (!byDay.has(ev.dayIndex)) byDay.set(ev.dayIndex, []);
          byDay.get(ev.dayIndex).push(ev);
        }
      }
    } catch (e) { /* sem eventos se o servidor falhar */ }

    grid.innerHTML = "";
    for (let i = 0; i < rows * 7; i++) {
      const date = new Date(YEAR, month, 1 - offset + i);
      const inYear = date.getFullYear() === YEAR;
      const cell = document.createElement("button");
      cell.className = "cell" + (i % 7 === 0 ? " sun" : "") + (date.getMonth() !== month ? " out" : "");
      cell.disabled = !inYear;

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = date.getDate();
      cell.append(num);

      if (inYear) {
        const list = byDay.get(dayIndex(YEAR, date.getMonth(), date.getDate())) || [];
        for (const ev of list.slice(0, 3)) {
          const chip = document.createElement("span");
          chip.className = "chip c" + ev.color;
          chip.textContent = ev.name;
          cell.append(chip);
        }
        if (list.length > 3) {
          const more = document.createElement("span");
          more.className = "more";
          more.textContent = "+" + (list.length - 3);
          cell.append(more);
        }
        cell.onclick = () => { location.href = "/day.html?date=" + YEAR + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()); };
      }
      grid.append(cell);
    }
  }

  prev.onclick = () => { month--; load(); };
  next.onclick = () => { month++; load(); };

  (async () => {
    try { diaryId = (await (await fetch("/diaries/current")).json()).id; } catch (e) { /* servidor fora do ar */ }
    load();
  })();
</script>
</body>
</html>
